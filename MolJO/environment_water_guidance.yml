name: molcraft-water
# Clean environment for MolCRAFT baseline + water/zinc-guided sampling.
#
# Key design decisions:
#   1. ALL torch packages from pip only — no pytorch/pyg/nvidia conda channels.
#   2. torch 2.5.1+cu121: torch_cluster 1.6.3 has a broken ABI against
#      torch 2.6.0 (missing parseSchemaOrName symbol). 2.5.1+cu121 is the
#      proven-stable PyG target. CUDA 12.1 runs fine on driver >= 525.
#   3. numpy pinned to 1.26.x — pandas/scipy C-exts built against 1.x ABI.
#   4. meeko==0.3.3 — 0.4+ imports rdkit.six removed from modern RDKit.
#   5. After env creation, remove any ~/.local torch shadow:
#        pip uninstall torch -y
#
# Usage:
#   mamba env create -f MolJO/environment_water_guidance.yml
#   conda activate molcraft-water
#   pip uninstall torch -y   # remove any ~/.local shadow

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9

  # --- Scientific stack ---
  - numpy=1.26.*
  - scipy
  - pandas
  - scikit-learn
  - matplotlib-base
  - networkx

  # --- Chemistry ---
  - rdkit
  - biopython
  - mdtraj
  - openbabel
  - spyrmsd

  # --- Utilities ---
  - tqdm
  - pyyaml
  - requests
  - tabulate
  - yacs
  - lark

  # --- Jupyter ---
  - jupyter
  - ipykernel
  - nglview

  - pip
  - pip:
    # ----------------------------------------------------------------
    # PyTorch 2.5.1 + CUDA 12.1 (all via pip — single source of truth)
    # ----------------------------------------------------------------
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1+cu121

    # ----------------------------------------------------------------
    # PyG — must match torch version (pt251)
    # ----------------------------------------------------------------
    - --find-links https://data.pyg.org/whl/torch-2.5.1+cu121.html
    - torch-scatter==2.1.2+pt251cu121
    - torch-sparse==0.6.18+pt251cu121
    - torch-cluster==1.6.3+pt251cu121
    - torch-geometric==2.6.1

    # ----------------------------------------------------------------
    # Training / Lightning stack
    # ----------------------------------------------------------------
    - pytorch-lightning>=2.0,<3.0
    - torchmetrics
    - lightning-utilities
    - tensorboardx
    - einops
    - easydict
    - lmdb

    # ----------------------------------------------------------------
    # Docking + pose evaluation
    # ----------------------------------------------------------------
    - vina
    - meeko==0.3.3
    - posecheck
    - prolif
    - MDAnalysis
