name: moljo-water-guidance
channels:
  - pyg
  - conda-forge
  - rdkit
  - pytorch
  - defaults

dependencies:
  - python=3.9

  # PyTorch — CUDA build must match your driver; change cu116 → cu117/cu118 if needed
  - cudatoolkit
  - pytorch::pytorch>=1.12          # pinned: PyG packages below are built against 1.12
  - pytorch-mutex=1.0=cuda
  - torchaudio
  - torchvision

  # PyG — build strings encode the exact torch+cuda version; mamba resolves these
  - pyg::pyg
  - pyg::pytorch-scatter            # scatter_max used in WaterPharmacophoreGuidance
  - pyg::pytorch-cluster
  - pyg::pytorch-sparse

  # Chemistry
  - rdkit
  - biopython
  - mdtraj

  # Scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib-base
  - networkx

  # Utilities
  - tqdm
  - pyyaml
  - requests
  - tabulate
  - yacs
  - spyrmsd

  # Jupyter
  - jupyter
  - ipykernel
  - nglview

  - pip
  - pip:
    - pytorch-lightning
    - torchmetrics
    - tensorboardx
    - einops
    - easydict
    - lightning-utilities

    # Water-guidance extras
    - prolif
    - MDAnalysis
    - vina
    - meeko
