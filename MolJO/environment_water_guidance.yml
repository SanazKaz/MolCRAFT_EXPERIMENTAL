name: molcraft-water
# Clean environment for MolCRAFT baseline + water/zinc-guided sampling.
#
# Key design decisions:
#   1. NO pytorch/pyg/nvidia conda channels — all torch packages come from pip
#      to guarantee a single consistent torch install with no conda/pip shadowing.
#   2. torch 2.5.1 + cu121: torch_cluster 1.6.3 has a broken ABI against
#      torch 2.6.0 (missing parseSchemaOrName symbol). 2.5.1+cu121 is the
#      most widely-tested stable combination with PyG. CUDA 12.1 toolkit runs
#      fine on any driver >= 525; the V100 with driver 580 handles it easily.
#   3. numpy pinned to 1.26.x — conda-built pandas/scipy are compiled against
#      numpy 1.x ABI; numpy 2.x breaks them at import.
#   4. meeko==0.3.3 — 0.4+ imports rdkit.six which was removed from modern RDKit.
#   5. IMPORTANT: after env creation, uninstall any user-level (~/.local) torch:
#        pip uninstall torch torchaudio torchvision -y
#      so the conda-env torch is the only one Python finds.
#
# Usage:
#   mamba env create -f MolJO/environment_water_guidance.yml
#   conda activate molcraft-water
#   pip uninstall torch torchaudio torchvision -y   # remove any ~/.local shadow

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9

  # --- Scientific stack (conda-forge — stable C-level ABIs) ---
  - numpy=1.26.*       # pinned: pandas/scipy/rdkit C-exts built against 1.x
  - scipy
  - pandas
  - scikit-learn
  - matplotlib-base
  - networkx

  # --- Chemistry ---
  - rdkit
  - biopython
  - mdtraj
  - openbabel
  - spyrmsd

  # --- Utilities ---
  - tqdm
  - pyyaml
  - requests
  - tabulate
  - yacs
  - lark

  # --- Jupyter ---
  - jupyter
  - ipykernel
  - nglview

  - pip
  - pip:
    # ----------------------------------------------------------------
    # PyTorch 2.5.1 + CUDA 12.1
    # torch_cluster 1.6.3 has a broken symbol against torch 2.6.0;
    # 2.5.1+cu121 is the proven-stable PyG target.
    # ----------------------------------------------------------------
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1+cu121
    - torchaudio==2.5.1+cu121
    - torchvision==0.20.1+cu121

    # ----------------------------------------------------------------
    # PyG — must match torch version exactly (pt251)
    # ----------------------------------------------------------------
    - --find-links https://data.pyg.org/whl/torch-2.5.1+cu121.html
    - torch-scatter==2.1.2+pt251cu121
    - torch-sparse==0.6.18+pt251cu121
    - torch-cluster==1.6.3+pt251cu121
    - torch-geometric==2.6.1

    # ----------------------------------------------------------------
    # Training / Lightning stack
    # ----------------------------------------------------------------
    - pytorch-lightning>=2.0,<3.0
    - torchmetrics
    - lightning-utilities
    - tensorboardx
    - einops
    - easydict
    - lmdb

    # ----------------------------------------------------------------
    # Docking + pose evaluation
    # ----------------------------------------------------------------
    - vina
    - meeko==0.3.3
    - posecheck
    - prolif
    - MDAnalysis
