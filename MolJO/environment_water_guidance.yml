name: moljo-water-guidance
channels:
  - conda-forge
  - pytorch
  - rdkit
  - defaults

dependencies:
  - python=3.9

  # PyTorch — pick the cudatoolkit that matches your driver
  - pytorch::pytorch
  - pytorch::pytorch-mutex=1.0=cuda
  - pytorch::torchaudio
  - pytorch::torchvision
  - cudatoolkit

  # Chemistry
  - rdkit
  - biopython
  - mdtraj

  # Scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib-base
  - networkx

  # Utilities
  - tqdm
  - pyyaml
  - requests
  - tabulate
  - yacs
  - spyrmsd

  # Jupyter
  - jupyter
  - ipykernel
  - nglview

  - pip
  - pip:
    # PyG — installed via pip so the wheel matches the installed torch version exactly
    # mamba/conda installs the wrong ABI if done via the pyg channel
    - torch-scatter
    - torch-sparse
    - torch-cluster
    - torch-geometric
    # Note: after env creation run this to get the right wheels:
    #   TORCH=$(python -c "import torch; print(torch.__version__)")
    #   CUDA=$(python -c "import torch; v=torch.version.cuda; print('cu'+''.join(v.split('.')))")
    #   pip install torch-scatter torch-sparse torch-cluster torch-geometric \
    #       -f https://data.pyg.org/whl/torch-${TORCH}+${CUDA}.html

    # MolJO core
    - lmdb
    - pytorch-lightning
    - torchmetrics
    - tensorboardx
    - einops
    - easydict
    - lightning-utilities

    # Water-guidance extras
    - prolif
    - MDAnalysis
    - vina
    - meeko==0.3.3   # 0.4.0 imports rdkit.six which was removed from modern RDKit
